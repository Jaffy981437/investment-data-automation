name: 抓取台股收盤價

# 台股平日收盤後,兩個市場資料陸續發布(TPEx 較早、TWSE 常晚幾小時)。
# UTC 10:00 = 台北時間 18:00,週一~週五,留足緩衝等資料到齊。
# GitHub Actions 的排程時間不保證準點,實務上可能晚幾到幾十分鐘。
on:
  schedule:
    - cron: "0 10 * * 1-5"
  workflow_dispatch: {}  # 允許在 GitHub 網頁上手動觸發,方便測試

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 簽出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝依賴(僅 fetch_prices.py 需要的)
        run: pip install requests

      - name: 執行抓取
        run: python scripts/fetch_prices.py

      # .gitignore 排除了 data/prices/,抓到的 csv 不會 commit 回 repo(避免 repo 肥大)。
      # 改用 artifact 保留:GitHub 上可直接下載,預設留存 90 天,不佔 repo 空間。
      - name: 保留抓取結果
        uses: actions/upload-artifact@v4
        with:
          name: prices-${{ github.run_id }}
          path: data/prices/
          retention-days: 90
          if-no-files-found: error  # 沒產出檔案就讓這步失敗,避免無聲成功
